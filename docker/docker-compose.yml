version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: nexavision_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexavision
    volumes:
      - mongo_data:/data/db

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: nexavision_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: nexavision_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/nexavision
      - AI_SERVICE_URL=http://ai-service:8000/api/v1
      - JWT_SECRET=nexavision_super_secret_jwt_key_2026
    depends_on:
      - mongodb
      - ai-service

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: nexavision_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
